openapi: 3.0.3
info:
  title: ML Speech Emotion Recognition API
  description: Production-ready FastAPI backend for speech emotion recognition using SageMaker deployed models
  version: 1.0.0
  contact:
    name: ML Speech Emotion Recognition Team
  license:
    name: MIT

servers:
  - url: https://api.ml-emotion.example.com/v1
    description: Production server
  - url: https://staging-api.ml-emotion.example.com/v1
    description: Staging server
  - url: http://localhost:8000/v1
    description: Local development server

tags:
  - name: prediction
    description: Audio file emotion prediction endpoints
  - name: health
    description: System health and monitoring endpoints
  - name: metrics
    description: Performance and usage metrics endpoints

paths:
  /predict-emotion:
    post:
      tags:
        - prediction
      summary: Upload audio file for emotion prediction
      description: Upload an audio file (WAV, MP3, M4A) and receive emotion predictions with confidence scores
      operationId: predictEmotionFromFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio_file
              properties:
                audio_file:
                  type: string
                  format: binary
                  description: Audio file (max 30MB, max 30 seconds)
                sample_rate:
                  type: integer
                  minimum: 16000
                  maximum: 48000
                  description: Optional sample rate override (16-48kHz)
                channels:
                  type: integer
                  minimum: 1
                  maximum: 2
                  description: Optional channel override (1=mono, 2=stereo)
      responses:
        '200':
          description: Successful prediction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'
        '400':
          description: Bad request - invalid audio file or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request entity too large - file exceeds 30MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - ApiKeyAuth: []

  /predict-emotion-url:
    post:
      tags:
        - prediction
      summary: Predict emotion from audio file URL
      description: Process an audio file from a URL and receive emotion predictions
      operationId: predictEmotionFromUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - audio_url
              properties:
                audio_url:
                  type: string
                  format: uri
                  description: URL to audio file (must be publicly accessible)
                timeout_seconds:
                  type: integer
                  minimum: 5
                  maximum: 60
                  default: 30
                  description: Download timeout in seconds
      responses:
        '200':
          description: Successful prediction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'
        '400':
          description: Bad request - invalid URL or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Audio file not found at URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Request timeout - could not download audio file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - ApiKeyAuth: []

  /stream-emotion:
    get:
      tags:
        - prediction
      summary: WebSocket endpoint for audio streaming
      description: WebSocket endpoint for real-time audio file transfer and emotion prediction
      operationId: streamEmotionWebSocket
      parameters:
        - name: correlation-id
          in: query
          schema:
            type: string
            format: uuid
          description: Optional correlation ID for tracking
      responses:
        '101':
          description: WebSocket connection established
          content:
            text/plain:
              schema:
                type: string
      security:
        - ApiKeyAuth: []

  /health:
    get:
      tags:
        - health
      summary: Check system health status
      description: Comprehensive health check including all dependencies and system metrics
      operationId: getHealthStatus
      responses:
        '200':
          description: System health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service unavailable - system is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/dependencies:
    get:
      tags:
        - health
      summary: Check individual dependency status
      description: Detailed status of each system dependency (SageMaker, S3, etc.)
      operationId: getDependencyStatus
      responses:
        '200':
          description: Dependency status information
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/DependencyStatus'

  /metrics:
    get:
      tags:
        - metrics
      summary: Get system metrics
      description: Current system performance and usage metrics
      operationId: getSystemMetrics
      responses:
        '200':
          description: System metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'

  /metrics/prometheus:
    get:
      tags:
        - metrics
      summary: Prometheus metrics endpoint
      description: Metrics in Prometheus format for monitoring systems
      operationId: getPrometheusMetrics
      responses:
        '200':
          description: Prometheus-format metrics
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    PredictionResponse:
      type: object
      required:
        - request_id
        - emotion
        - confidence
        - all_emotions
        - processing_time_ms
        - model_version
        - timestamp
      properties:
        request_id:
          type: string
          format: uuid
          description: Unique identifier for this prediction request
        emotion:
          $ref: '#/components/schemas/EmotionType'
        confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: Confidence score for the predicted emotion
        all_emotions:
          type: object
          description: Confidence scores for all emotions
          additionalProperties:
            type: number
            minimum: 0.0
            maximum: 1.0
        processing_time_ms:
          type: number
          minimum: 0
          description: Total processing time in milliseconds
        model_version:
          type: string
          description: Version of the model that made the prediction
        endpoint_name:
          type: string
          description: SageMaker endpoint name used for prediction
        timestamp:
          type: string
          format: date-time
          description: Timestamp when prediction was completed
        audio_metadata:
          $ref: '#/components/schemas/AudioMetadata'

    EmotionType:
      type: string
      enum:
        - happy
        - sad
        - angry
        - fearful
        - disgusted
        - neutral

    AudioMetadata:
      type: object
      required:
        - original_filename
        - file_size_bytes
        - duration_seconds
        - sample_rate
        - channels
      properties:
        original_filename:
          type: string
          description: Original filename of the uploaded audio file
        file_size_bytes:
          type: integer
          minimum: 0
          maximum: 30000000
          description: File size in bytes (max 30MB)
        duration_seconds:
          type: number
          minimum: 0
          maximum: 30.0
          description: Audio duration in seconds (max 30s)
        sample_rate:
          type: integer
          minimum: 16000
          maximum: 48000
          description: Audio sample rate in Hz (16-48kHz)
        channels:
          type: integer
          minimum: 1
          maximum: 2
          description: Number of audio channels (1=mono, 2=stereo)
        format:
          $ref: '#/components/schemas/AudioFormat'

    AudioFormat:
      type: string
      enum:
        - wav
        - mp3
        - m4a

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - request_id
        - timestamp
      properties:
        error:
          type: string
          description: Error code for programmatic handling
        message:
          type: string
          description: Human-readable error message
        request_id:
          type: string
          format: uuid
          description: Request ID for correlation
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
        details:
          type: object
          description: Additional error details (optional)

    HealthResponse:
      type: object
      required:
        - status
        - uptime_seconds
        - version
        - dependencies
        - timestamp
      properties:
        status:
          $ref: '#/components/schemas/SystemStatus'
        uptime_seconds:
          type: number
          minimum: 0
          description: System uptime in seconds
        version:
          type: string
          description: API version
        dependencies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DependencyStatus'
        metrics:
          $ref: '#/components/schemas/SystemMetrics'
        timestamp:
          type: string
          format: date-time
          description: Health check timestamp

    SystemStatus:
      type: string
      enum:
        - healthy
        - degraded
        - unhealthy

    DependencyStatus:
      type: object
      required:
        - status
        - last_check
      properties:
        status:
          $ref: '#/components/schemas/ServiceStatus'
        response_time_ms:
          type: number
          minimum: 0
          description: Dependency response time in milliseconds
        last_check:
          type: string
          format: date-time
          description: Last health check timestamp
        error_details:
          type: string
          description: Error details if dependency is unhealthy

    ServiceStatus:
      type: string
      enum:
        - up
        - down
        - degraded
        - timeout

    SystemMetrics:
      type: object
      required:
        - active_websocket_connections
        - requests_per_minute
        - average_response_time_ms
        - error_rate_percent
      properties:
        active_websocket_connections:
          type: integer
          minimum: 0
          description: Number of active WebSocket connections
        requests_per_minute:
          type: number
          minimum: 0
          description: Requests per minute
        average_response_time_ms:
          type: number
          minimum: 0
          description: Average response time in milliseconds
        error_rate_percent:
          type: number
          minimum: 0
          maximum: 100
          description: Error rate as percentage
        memory_usage_percent:
          type: number
          minimum: 0
          maximum: 100
          description: Memory usage as percentage
        cpu_usage_percent:
          type: number
          minimum: 0
          maximum: 100
          description: CPU usage as percentage

    MetricsResponse:
      type: object
      required:
        - timestamp
        - metrics
      properties:
        timestamp:
          type: string
          format: date-time
          description: Metrics collection timestamp
        metrics:
          $ref: '#/components/schemas/SystemMetrics'
        detailed_metrics:
          type: object
          description: Additional detailed metrics

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication (optional for V1)

  headers:
    X-Correlation-ID:
      description: Correlation ID for request tracing
      schema:
        type: string
        format: uuid
    X-Request-ID:
      description: Request ID for tracking
      schema:
        type: string
        format: uuid

# WebSocket Message Schemas (not part of OpenAPI but documented here)
websocket-messages:
  client-messages:
    audio-chunk:
      type: object
      required:
        - chunk_index
        - audio_data
        - is_final
      properties:
        chunk_index:
          type: integer
          minimum: 0
          description: Sequential index of this chunk
        audio_data:
          type: string
          format: base64
          description: Base64-encoded audio chunk (1 second of audio)
        is_final:
          type: boolean
          description: True if this is the final chunk
        metadata:
          type: object
          description: Optional metadata about this chunk

    session-start:
      type: object
      required:
        - session_id
        - total_chunks
      properties:
        session_id:
          type: string
          format: uuid
          description: Unique session identifier
        total_chunks:
          type: integer
          minimum: 1
          description: Expected total number of chunks
        metadata:
          type: object
          description: Optional session metadata

  server-messages:
    prediction-result:
      type: object
      required:
        - request_id
        - prediction
      properties:
        request_id:
          type: string
          format: uuid
          description: Request ID for correlation
        prediction:
          $ref: '#/components/schemas/PredictionResponse'
        processing_time_ms:
          type: number
          description: Total WebSocket session processing time

    chunk-acknowledgment:
      type: object
      required:
        - chunk_index
        - received
      properties:
        chunk_index:
          type: integer
          description: Index of acknowledged chunk
        received:
          type: boolean
          description: Whether chunk was successfully received
        error_message:
          type: string
          description: Error message if chunk was rejected

    session-status:
      type: object
      required:
        - status
        - progress
      properties:
        status:
          type: string
          enum: [receiving, processing, completed, error]
          description: Current session status
        progress:
          type: object
          properties:
            chunks_received:
              type: integer
              description: Number of chunks received
            total_chunks:
              type: integer
              description: Total expected chunks
            percentage:
              type: number
              minimum: 0
              maximum: 100
              description: Progress percentage
        error_message:
          type: string
          description: Error message if status is error