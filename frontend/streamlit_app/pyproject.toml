[tool.poetry]
name = "ml-speech-emotion-recognition-streamlit"
version = "0.1.0"
description = "Streamlit frontend for ML Speech Emotion Recognition"
authors = ["Sagar Pratap Singh"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
streamlit = ">=1.51.0,<2.0.0"
librosa = ">=0.11.0,<0.12.0"
soundfile = ">=0.13.1,<0.14.0"
numpy = ">=2.3.4,<3.0.0"
matplotlib = ">=3.10.7,<4.0.0"
seaborn = ">=0.13.2,<0.14.0"
scipy = ">=1.16.3,<2.0.0"
requests = ">=2.32.5,<3.0.0"
pillow = ">=12.0.0,<13.0.0"
python-multipart = ">=0.0.20,<0.0.21"
plotly = ">=6.5.0,<7.0.0"
pandas = ">=2.3.3,<3.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"