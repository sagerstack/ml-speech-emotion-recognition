[server]
# Server configuration for production deployment
headless = true
port = 8501
address = "0.0.0.0"
enableCORS = true
enableXsrfProtection = false
enableWebsocketCompression = true
fileWatcherType = "none"

# Fix for custom components (streamlit-antd-components)
# Allow components to be loaded from any origin
allowRunOnSave = false
runOnSave = false

[runner]
# Faster rerun behavior
fastReruns = true
# Fix for librosa caching issues
magicEnabled = false

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"
serverPort = 8501

[client]
# Show toolbar with settings but hide Deploy button
toolbarMode = "viewer"
showErrorDetails = true
