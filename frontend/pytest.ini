[tool:pytest]
minversion = 7.0
addopts =
    --strict-markers
    --strict-config
    --verbose
    --cov=streamlit_app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=85
    --tb=short
    -ra
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (require external services)
    e2e: End-to-end tests (slow, full workflow)
    slow: Tests that take more than 1 second
    api: Tests that require API calls
    audio: Tests that require audio processing
    ui: Tests that require UI components
asyncio_mode = auto