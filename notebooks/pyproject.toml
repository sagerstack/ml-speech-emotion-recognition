[project]
name = "ml-speech-notebooks"
version = "0.1.0"
description = "Jupyter notebooks for ML speech emotion recognition"
authors = [
    {name = "Claude"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=2.3.5,<3.0.0)",
    "librosa (>=0.11.0,<0.12.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "ipython (>=9.7.0,<10.0.0)",
    "keras (>=3.12.0,<4.0.0)",
    "tensorflow (>=2.20.0,<3.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
