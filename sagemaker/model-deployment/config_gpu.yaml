# SageMaker Model Deployment Configuration - GPU Provisioned

# Model Configuration
model:
  name: "ehcalabres/wav2vec2-lg-xlsr-en-speech-emotion-recognition"
  display_name: "speech-emotion-recognition-wav2vec2-gpu"
  description: "Wav2Vec2-LG-XLSR for speech emotion recognition with GPU acceleration"
  instance_type: "ml.g4dn.xlarge"  # GPU + 16GB memory
  framework: "pytorch"
  py_version: "py310"

# AWS Configuration
aws:
  region: "us-east-1"
  role_name: "SageMakerExecutionRole"
  bucket_prefix: "sagemaker-speech-emotion"

# Model Configuration
model_config:
  sample_rate: 16000
  max_audio_length: 30  # Maximum audio length in seconds

# Monitoring Configuration
monitoring:
  enable_cloudwatch: true
  log_level: "INFO"
  metrics:
    - "Invocations"
    - "Invocation4XXErrors"
    - "Invocation5XXErrors"
    - "ModelLatency"

# Cost Optimization
cost_optimization:
  auto_delete_endpoint: false
  cleanup_after_days: 30
  cost_alert_threshold: 150  # Higher threshold for GPU instances ($150/month)

# Testing Configuration (same as original)
testing:
  test_audio_files:
    - "test_samples/happy_sample.wav"
    - "test_samples/sad_sample.wav"
    - "test_samples/angry_sample.wav"
  expected_emotions:
    - "happy"
    - "sad"
    - "angry"