name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  POETRY_VERSION: "1.8.3"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: "ci-fake-secret-key"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.in-project true
          poetry config virtualenvs.create true

      - name: Regenerate lockfile
        run: poetry lock --no-interaction --no-ansi

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-ansi

      - name: Run unit tests
        run: poetry run pytest -m unit --maxfail=1 -p no:pytest_cov -o addopts="--strict-markers --strict-config --verbose -p no:pytest_asyncio --tb=short -ra"

  terraform-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

  build-docker-images:
    runs-on: ubuntu-latest
    needs: [tests, terraform-format]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          docker build \
            -f deployment/docker/backend/Dockerfile \
            -t backend:ci-test \
            --load \
            .

      - name: Build Streamlit Docker image
        run: |
          docker build \
            -f deployment/docker/streamlit/Dockerfile \
            -t streamlit:ci-test \
            --load \
            .

  push-to-ecr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      BACKEND_REPO_NAME: ml-speech-emotion-backend
      STREAMLIT_REPO_NAME: ml-speech-emotion-streamlit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image URIs and tags
        id: image-meta
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BACKEND_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BACKEND_REPO_NAME}"
          STREAMLIT_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${STREAMLIT_REPO_NAME}"

          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> $GITHUB_ENV
          echo "STREAMLIT_IMAGE=${STREAMLIT_IMAGE}" >> $GITHUB_ENV

          TAG="${GITHUB_SHA:0:7}"
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV
          echo "Building images with tag: ${TAG}"

      - name: Build and push backend image to ECR
        run: |
          docker build \
            -f deployment/docker/backend/Dockerfile \
            -t "${BACKEND_IMAGE}:${IMAGE_TAG}" \
            -t "${BACKEND_IMAGE}:latest" \
            --load \
            .

          docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"
          docker push "${BACKEND_IMAGE}:latest"

      - name: Build and push Streamlit image to ECR
        run: |
          docker build \
            -f deployment/docker/streamlit/Dockerfile \
            -t "${STREAMLIT_IMAGE}:${IMAGE_TAG}" \
            -t "${STREAMLIT_IMAGE}:latest" \
            --load \
            .

          docker push "${STREAMLIT_IMAGE}:${IMAGE_TAG}"
          docker push "${STREAMLIT_IMAGE}:latest"

      - name: Output image tags
        run: |
          echo "Backend image: ${BACKEND_IMAGE}:${IMAGE_TAG}"
          echo "Streamlit image: ${STREAMLIT_IMAGE}:${IMAGE_TAG}"
