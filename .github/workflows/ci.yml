name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POETRY_VERSION: "1.8.3"

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: "ci-fake-secret-key"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.in-project true
          poetry config virtualenvs.create true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-ansi

      - name: Run unit tests
        run: poetry run pytest --maxfail=1

  terraform-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

  build-docker-images:
    runs-on: ubuntu-latest
    needs: [tests, terraform-format]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          docker build \
            -f deployment/docker/backend/Dockerfile \
            -t backend:ci-test \
            --load \
            .

      - name: Build Streamlit Docker image
        run: |
          docker build \
            -f deployment/docker/streamlit/Dockerfile \
            -t streamlit:ci-test \
            --load \
            .

      - name: Free up disk space before saving
        run: |
          # Remove build cache and dangling images only (keeps our tagged images)
          docker builder prune -af
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Save Docker images as artifacts
        run: |
          docker save backend:ci-test -o /tmp/backend-image.tar
          docker save streamlit:ci-test -o /tmp/streamlit-image.tar

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: /tmp/backend-image.tar
          retention-days: 1

      - name: Upload Streamlit image artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-image
          path: /tmp/streamlit-image.tar
          retention-days: 1

  validate-docker-images:
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    steps:
      - name: Download backend image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp

      - name: Download Streamlit image artifact
        uses: actions/download-artifact@v4
        with:
          name: streamlit-image
          path: /tmp

      - name: Load Docker images
        run: |
          docker load -i /tmp/backend-image.tar
          docker load -i /tmp/streamlit-image.tar

      - name: Validate backend container starts
        run: |
          docker run -d --name backend-test -p 8000:8000 \
            -e SECRET_KEY="ci-test-secret-key" \
            -e AWS_REGION="us-east-1" \
            -e SAGEMAKER_ENDPOINT_NAME="ci-test-endpoint" \
            backend:ci-test

          sleep 10

          if docker ps --filter name=backend-test | grep backend-test; then
            echo "✅ Backend container is running"
            docker logs backend-test
            docker stop backend-test
            docker rm backend-test
          else
            echo "❌ Backend container failed to start"
            docker logs backend-test || echo "No logs available"
            docker rm backend-test
            exit 1
          fi

      - name: Validate Streamlit container starts
        run: |
          docker run -d --name streamlit-test -p 8501:8501 streamlit:ci-test

          sleep 10

          if docker ps --filter name=streamlit-test | grep streamlit-test; then
            echo "✅ Streamlit container is running"
            docker logs streamlit-test
            docker stop streamlit-test
            docker rm streamlit-test
          else
            echo "❌ Streamlit container failed to start"
            docker logs streamlit-test || echo "No logs available"
            docker rm streamlit-test
            exit 1
          fi

  push-to-ecr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [validate-docker-images]
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      BACKEND_REPO_NAME: ml-speech-emotion-backend
      STREAMLIT_REPO_NAME: ml-speech-emotion-streamlit

    steps:
      - name: Download backend image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp

      - name: Download Streamlit image artifact
        uses: actions/download-artifact@v4
        with:
          name: streamlit-image
          path: /tmp

      - name: Load Docker images
        run: |
          docker load -i /tmp/backend-image.tar
          docker load -i /tmp/streamlit-image.tar

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image URIs and tags
        id: image-meta
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BACKEND_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BACKEND_REPO_NAME}"
          STREAMLIT_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${STREAMLIT_REPO_NAME}"

          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> $GITHUB_ENV
          echo "STREAMLIT_IMAGE=${STREAMLIT_IMAGE}" >> $GITHUB_ENV

          TAG="${GITHUB_SHA:0:7}"
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV
          echo "Building images with tag: ${TAG}"

      - name: Tag and push backend image to ECR
        run: |
          docker tag backend:ci-test "${BACKEND_IMAGE}:${IMAGE_TAG}"
          docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"

          docker tag backend:ci-test "${BACKEND_IMAGE}:latest"
          docker push "${BACKEND_IMAGE}:latest"

      - name: Tag and push Streamlit image to ECR
        run: |
          docker tag streamlit:ci-test "${STREAMLIT_IMAGE}:${IMAGE_TAG}"
          docker push "${STREAMLIT_IMAGE}:${IMAGE_TAG}"

          docker tag streamlit:ci-test "${STREAMLIT_IMAGE}:latest"
          docker push "${STREAMLIT_IMAGE}:latest"

      - name: Output image tags
        run: |
          echo "Backend image: ${BACKEND_IMAGE}:${IMAGE_TAG}"
          echo "Streamlit image: ${STREAMLIT_IMAGE}:${IMAGE_TAG}"
