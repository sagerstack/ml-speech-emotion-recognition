name: Deploy to EKS

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  K8S_NAMESPACE: ml-speech-emotion
  EKS_CLUSTER_NAME: ml-speech-emotion-prod-eks
  KUSTOMIZE_DIR: deployment/k8s/prod
  BACKEND_REPO_NAME: ml-speech-emotion-backend
  STREAMLIT_REPO_NAME: ml-speech-emotion-streamlit

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
    # This workflow deploys pre-built Docker images from ECR
    # Images are built and pushed by the CI workflow after all gates pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Compute image URIs and tags
        id: image-uris
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BACKEND_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BACKEND_REPO_NAME}"
          STREAMLIT_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${STREAMLIT_REPO_NAME}"

          # Use same short SHA format as CI (first 7 chars)
          IMAGE_TAG="${GITHUB_SHA:0:7}"

          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> $GITHUB_ENV
          echo "STREAMLIT_IMAGE=${STREAMLIT_IMAGE}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

          echo "Deploying images with tag: ${IMAGE_TAG}"
          echo "Backend: ${BACKEND_IMAGE}:${IMAGE_TAG}"
          echo "Streamlit: ${STREAMLIT_IMAGE}:${IMAGE_TAG}"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.2"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Ensure namespace exists
        run: |
          kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          echo "✓ Namespace ${{ env.K8S_NAMESPACE }} is ready"

      - name: Set image tags in kustomization
        working-directory: ${{ env.KUSTOMIZE_DIR }}
        run: |
          kustomize edit set image sagerstack/ml-speech-emotion-backend=${BACKEND_IMAGE}:${IMAGE_TAG}
          kustomize edit set image sagerstack/ml-speech-emotion-streamlit=${STREAMLIT_IMAGE}:${IMAGE_TAG}

      - name: Deploy manifests
        run: kubectl apply -k ${{ env.KUSTOMIZE_DIR }}

      - name: Force fresh rollout
        run: |
          echo "Forcing restart of deployments to ensure clean rollout..."
          kubectl rollout restart deployment/backend -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout restart deployment/streamlit -n ${{ env.K8S_NAMESPACE }}
          echo "✓ Rollout restart initiated"

      - name: Verify backend rollout
        run: kubectl rollout status deployment/backend -n ${{ env.K8S_NAMESPACE }} --timeout=360s

      - name: Verify Streamlit rollout
        run: kubectl rollout status deployment/streamlit -n ${{ env.K8S_NAMESPACE }} --timeout=360s

      - name: Wait for ALB provisioning
        run: |
          echo "Waiting for Application Load Balancer to be provisioned..."
          echo "This may take 2-3 minutes on first deployment..."

          TIMEOUT=300
          ELAPSED=0
          INTERVAL=10

          while [ $ELAPSED -lt $TIMEOUT ]; do
            ALB_ADDRESS=$(kubectl get ingress ml-emotion-ingress -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")

            if [ -n "$ALB_ADDRESS" ]; then
              echo "✓ ALB provisioned successfully: ${ALB_ADDRESS}"
              echo "ALB_ADDRESS=${ALB_ADDRESS}" >> $GITHUB_ENV
              break
            fi

            echo "Waiting for ALB... (${ELAPSED}s/${TIMEOUT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ -z "$ALB_ADDRESS" ]; then
            echo "⚠ Warning: ALB not ready after ${TIMEOUT}s. Check AWS Load Balancer Controller logs."
            echo "Run: kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller"
            exit 1
          fi

      - name: Display application URLs
        run: |
          ALB_ADDRESS="${{ env.ALB_ADDRESS }}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 Deployment Successful!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📱 Application URLs:"
          echo "   Frontend (Streamlit):  http://${ALB_ADDRESS}/"
          echo "   Backend API:           http://${ALB_ADDRESS}/api"
          echo "   API Docs:              http://${ALB_ADDRESS}/docs"
          echo "   Health Check:          http://${ALB_ADDRESS}/health"
          echo "   Metrics:               http://${ALB_ADDRESS}/metrics"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Post-deploy smoke tests
        run: |
          ALB_ADDRESS="${{ env.ALB_ADDRESS }}"
          echo "Running smoke tests against ALB..."

          # Test backend health endpoint
          echo "Testing backend health endpoint..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://${ALB_ADDRESS}/health" || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Backend health check passed (HTTP $HTTP_CODE)"
          else
            echo "⚠ Backend health check returned HTTP $HTTP_CODE"
            echo "Note: Pods may still be starting up. Check manually: http://${ALB_ADDRESS}/health"
          fi

          # Test frontend
          echo "Testing frontend endpoint..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://${ALB_ADDRESS}/" || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Frontend check passed (HTTP $HTTP_CODE)"
          else
            echo "⚠ Frontend returned HTTP $HTTP_CODE"
            echo "Note: Streamlit may still be starting up. Check manually: http://${ALB_ADDRESS}/"
          fi

      - name: Deploy monitoring stack
        run: |
          echo "Deploying comprehensive monitoring stack..."
          echo "Components: Prometheus, Grafana, Loki, Tempo, Promtail, kube-state-metrics, node-exporter"

          # Deploy monitoring stack
          kubectl apply -f deployment/k8s/prod/monitoring-stack.yaml
          echo "✓ Monitoring stack manifests applied"

          # Deploy Grafana dashboards
          kubectl apply -f deployment/k8s/prod/grafana-dashboards-configmap.yaml
          echo "✓ Grafana dashboards ConfigMap applied"

          echo ""
          echo "Waiting for monitoring components to be ready..."

          # Wait for main monitoring pods
          kubectl wait --for=condition=ready pod -l app=prometheus -n monitoring --timeout=180s || echo "⚠ Prometheus not ready yet"
          kubectl wait --for=condition=ready pod -l app=grafana -n monitoring --timeout=180s || echo "⚠ Grafana not ready yet"
          kubectl wait --for=condition=ready pod -l app=loki -n monitoring --timeout=180s || echo "⚠ Loki not ready yet"
          kubectl wait --for=condition=ready pod -l app=tempo -n monitoring --timeout=180s || echo "⚠ Tempo not ready yet"
          kubectl wait --for=condition=ready pod -l app=kube-state-metrics -n monitoring --timeout=180s || echo "⚠ kube-state-metrics not ready yet"

          # Wait for DaemonSets
          echo "Waiting for DaemonSets..."
          kubectl rollout status daemonset/promtail -n monitoring --timeout=180s || echo "⚠ Promtail not ready yet"
          kubectl rollout status daemonset/node-exporter -n monitoring --timeout=180s || echo "⚠ node-exporter not ready yet"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Comprehensive Monitoring Stack Deployed Successfully"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🔍 Access Monitoring Services (use kubectl port-forward):"
          echo ""
          echo "   📉 Grafana Dashboard (Main Interface):"
          echo "   $ kubectl port-forward -n monitoring svc/grafana 3000:3000"
          echo "   → http://localhost:3000 (admin/admin)"
          echo "   → Pre-loaded dashboards: FastAPI Observability, K8s Cluster Metrics"
          echo ""
          echo "   📈 Prometheus (Metrics):"
          echo "   $ kubectl port-forward -n monitoring svc/prometheus 9090:9090"
          echo "   → http://localhost:9090"
          echo ""
          echo "   📋 Loki (Logs):"
          echo "   $ kubectl port-forward -n monitoring svc/loki 3100:3100"
          echo "   → http://localhost:3100"
          echo ""
          echo "   🔍 Tempo (Distributed Tracing):"
          echo "   $ kubectl port-forward -n monitoring svc/tempo 3200:3200"
          echo "   → http://localhost:3200"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📈 Backend Metrics & Tracing:"
          echo "   Backend metrics available at: /metrics endpoint"
          echo "   OpenTelemetry traces sent to Tempo at: tempo.monitoring.svc.cluster.local:4317"
          echo ""
          echo "🔧 Quick Health Checks:"
          echo "   # All monitoring pods"
          echo "   $ kubectl get pods -n monitoring"
          echo ""
          echo "   # Check DaemonSets (should be running on all nodes)"
          echo "   $ kubectl get daemonsets -n monitoring"
          echo ""
          echo "   # View Prometheus targets"
          echo "   $ kubectl port-forward -n monitoring svc/prometheus 9090:9090"
          echo "   # Then visit: http://localhost:9090/targets"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✅ Monitoring Components:"
          echo "   ✓ Prometheus - Metrics collection with k8s service discovery"
          echo "   ✓ Grafana - Dashboards with Prometheus/Loki/Tempo datasources"
          echo "   ✓ Loki - Log aggregation"
          echo "   ✓ Tempo - Distributed tracing (OTLP/Jaeger compatible)"
          echo "   ✓ Promtail - Log collection (DaemonSet on all nodes)"
          echo "   ✓ kube-state-metrics - K8s cluster state metrics"
          echo "   ✓ node-exporter - Node-level system metrics (DaemonSet)"
          echo ""
          echo "📊 Storage:"
          echo "   • Prometheus: 20Gi gp3"
          echo "   • Loki: 20Gi gp3"
          echo "   • Grafana: 10Gi gp3"
          echo "   • Tempo: 10Gi gp3"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
