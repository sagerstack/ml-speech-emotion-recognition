name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: 'Model version to deploy to SageMaker (e.g., v5). Leave empty to skip SageMaker deployment.'
        required: false
        type: string
      skip_sagemaker:
        description: 'Skip SageMaker deployment (even if model_version is provided)'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  K8S_NAMESPACE: ml-speech-emotion
  EKS_CLUSTER_NAME: ml-speech-emotion-prod-eks
  KUSTOMIZE_DIR: deployment/k8s/prod
  BACKEND_REPO_NAME: ml-speech-emotion-backend
  STREAMLIT_REPO_NAME: ml-speech-emotion-streamlit
  SAGEMAKER_ENDPOINT_NAME: ml-emotion-prod

jobs:
  deploy-model-to-sagemaker:
    name: Deploy Model to SageMaker
    runs-on: ubuntu-latest
    if: ${{ inputs.model_version != '' && !inputs.skip_sagemaker }}
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
    outputs:
      sagemaker_endpoint: ${{ steps.deploy.outputs.endpoint_name }}
      model_version: ${{ inputs.model_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Set S3 bucket name
        id: set-bucket
        run: |
          # Derive bucket name from project naming convention
          # Format: ${project_name}-models-${aws_region}
          MODEL_BUCKET="ml-speech-emotion-models-${AWS_REGION}"

          echo "MODEL_BUCKET=${MODEL_BUCKET}" >> $GITHUB_ENV
          echo "✓ Using S3 bucket: ${MODEL_BUCKET}"

      - name: Validate SageMaker package exists in S3
        env:
          MODEL_VERSION: ${{ inputs.model_version }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Validating SageMaker package for $MODEL_VERSION..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          S3_MODEL_URI="s3://$MODEL_BUCKET/sagemaker-models/$MODEL_VERSION/model.tar.gz"

          # Check if SageMaker package exists
          if ! aws s3 ls "$S3_MODEL_URI" >/dev/null 2>&1; then
            echo "❌ Error: SageMaker package not found in S3"
            echo ""
            echo "Expected location: $S3_MODEL_URI"
            echo ""
            echo "Please upload model using:"
            echo "  ./scripts/upload_model_to_s3.sh $MODEL_VERSION --profile ml-ser-deploy"
            echo ""
            echo "The upload script will:"
            echo "  1. Upload raw model files to raw-models/"
            echo "  2. Package for SageMaker locally"
            echo "  3. Upload package to sagemaker-models/"
            exit 1
          fi

          PACKAGE_SIZE=$(aws s3 ls "$S3_MODEL_URI" | awk '{print $3}')
          PACKAGE_SIZE_MB=$((PACKAGE_SIZE / 1024 / 1024))

          echo "✅ SageMaker package found"
          echo "   Location: $S3_MODEL_URI"
          echo "   Size: ${PACKAGE_SIZE_MB} MB"
          echo ""

          # Save for deployment step
          echo "S3_MODEL_URI=${S3_MODEL_URI}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deployment dependencies
        run: |
          pip install boto3

      - name: Deploy to SageMaker
        id: deploy
        env:
          MODEL_VERSION: ${{ inputs.model_version }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 Deploying model to SageMaker..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          python deployment/sagemaker/scripts/deploy_to_sagemaker.py \
            --model-version "$MODEL_VERSION" \
            --endpoint-name "${{ env.SAGEMAKER_ENDPOINT_NAME }}" \
            --instance-type ml.t2.medium \
            --s3-uri "$S3_MODEL_URI" \
            --region "${{ env.AWS_REGION }}" \
            --execution-role-arn "arn:aws:iam::303440520181:role/ml-speech-emotion-prod-sagemaker-execution" \
            --timeout 900

          echo ""
          echo "endpoint_name=${{ env.SAGEMAKER_ENDPOINT_NAME }}" >> $GITHUB_OUTPUT

      - name: Verify SageMaker endpoint
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Verifying SageMaker endpoint..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          aws sagemaker describe-endpoint \
            --endpoint-name "${{ env.SAGEMAKER_ENDPOINT_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --query '{Name:EndpointName, Status:EndpointStatus, InstanceType:ProductionVariants[0].InstanceType, CurrentInstanceCount:ProductionVariants[0].CurrentInstanceCount}' \
            --output table

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 SageMaker Deployment Complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "   Endpoint Name: ${{ env.SAGEMAKER_ENDPOINT_NAME }}"
          echo "   Model Version: ${{ inputs.model_version }}"
          echo "   Instance Type: ml.t3.medium"
          echo "   Region: ${{ env.AWS_REGION }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [deploy-model-to-sagemaker]
    if: ${{ always() }}
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
    # This workflow deploys pre-built Docker images from ECR
    # Images are built and pushed by the CI workflow after all gates pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Compute image URIs and tags
        id: image-uris
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BACKEND_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BACKEND_REPO_NAME}"
          STREAMLIT_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${STREAMLIT_REPO_NAME}"

          # Use same short SHA format as CI (first 7 chars)
          DESIRED_TAG="${GITHUB_SHA:0:7}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Checking image availability in ECR..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Desired tag (from commit SHA): ${DESIRED_TAG}"
          echo ""

          # Check if backend image with desired tag exists
          BACKEND_EXISTS=$(aws ecr describe-images \
            --repository-name ${BACKEND_REPO_NAME} \
            --region ${AWS_REGION} \
            --image-ids imageTag=${DESIRED_TAG} \
            --query 'imageDetails[0].imageTags[0]' \
            --output text 2>/dev/null || echo "")

          # Check if streamlit image with desired tag exists
          STREAMLIT_EXISTS=$(aws ecr describe-images \
            --repository-name ${STREAMLIT_REPO_NAME} \
            --region ${AWS_REGION} \
            --image-ids imageTag=${DESIRED_TAG} \
            --query 'imageDetails[0].imageTags[0]' \
            --output text 2>/dev/null || echo "")

          # Determine which tag to use
          if [ -n "$BACKEND_EXISTS" ] && [ -n "$STREAMLIT_EXISTS" ]; then
            IMAGE_TAG="${DESIRED_TAG}"
            echo "✓ Found images with tag: ${DESIRED_TAG}"
            echo "  Backend:   ${BACKEND_IMAGE}:${IMAGE_TAG} ✓"
            echo "  Streamlit: ${STREAMLIT_IMAGE}:${IMAGE_TAG} ✓"
          else
            IMAGE_TAG="latest"
            echo "⚠ Images with tag ${DESIRED_TAG} not found in ECR"
            echo ""
            echo "Missing images:"
            [ -z "$BACKEND_EXISTS" ] && echo "  ✗ Backend:   ${BACKEND_IMAGE}:${DESIRED_TAG}"
            [ -z "$STREAMLIT_EXISTS" ] && echo "  ✗ Streamlit: ${STREAMLIT_IMAGE}:${DESIRED_TAG}"
            echo ""
            echo "📌 Falling back to: latest"
            echo "  Backend:   ${BACKEND_IMAGE}:latest"
            echo "  Streamlit: ${STREAMLIT_IMAGE}:latest"
            echo ""
            echo "💡 Note: This usually happens when CI workflow was cancelled or failed."
            echo "   The 'latest' tag points to the most recent successful build."
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> $GITHUB_ENV
          echo "STREAMLIT_IMAGE=${STREAMLIT_IMAGE}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "DESIRED_TAG=${DESIRED_TAG}" >> $GITHUB_ENV

          echo ""
          echo "🚀 Proceeding with deployment using tag: ${IMAGE_TAG}"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.2"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Ensure namespace exists
        run: |
          kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          echo "✓ Namespace ${{ env.K8S_NAMESPACE }} is ready"

      - name: Set image tags in kustomization
        working-directory: ${{ env.KUSTOMIZE_DIR }}
        run: |
          kustomize edit set image sagerstack/ml-speech-emotion-backend=${BACKEND_IMAGE}:${IMAGE_TAG}
          kustomize edit set image sagerstack/ml-speech-emotion-streamlit=${STREAMLIT_IMAGE}:${IMAGE_TAG}

      - name: Deploy manifests
        run: kubectl apply -k ${{ env.KUSTOMIZE_DIR }}

      - name: Force fresh rollout
        run: |
          echo "Forcing restart of deployments to ensure clean rollout..."
          kubectl rollout restart deployment/backend -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout restart deployment/streamlit -n ${{ env.K8S_NAMESPACE }}
          echo "✓ Rollout restart initiated"

      - name: Verify backend rollout
        run: kubectl rollout status deployment/backend -n ${{ env.K8S_NAMESPACE }} --timeout=360s

      - name: Verify Streamlit rollout
        run: kubectl rollout status deployment/streamlit -n ${{ env.K8S_NAMESPACE }} --timeout=360s

      - name: Wait for ALB provisioning
        run: |
          echo "Waiting for Application Load Balancer to be provisioned..."
          echo "This may take 2-3 minutes on first deployment..."

          TIMEOUT=300
          ELAPSED=0
          INTERVAL=10

          while [ $ELAPSED -lt $TIMEOUT ]; do
            ALB_ADDRESS=$(kubectl get ingress ml-emotion-ingress -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")

            if [ -n "$ALB_ADDRESS" ]; then
              echo "✓ ALB provisioned successfully: ${ALB_ADDRESS}"
              echo "ALB_ADDRESS=${ALB_ADDRESS}" >> $GITHUB_ENV
              break
            fi

            echo "Waiting for ALB... (${ELAPSED}s/${TIMEOUT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ -z "$ALB_ADDRESS" ]; then
            echo "⚠ Warning: ALB not ready after ${TIMEOUT}s. Check AWS Load Balancer Controller logs."
            echo "Run: kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller"
            exit 1
          fi

      - name: Post-deploy smoke tests
        run: |
          ALB_ADDRESS="${{ env.ALB_ADDRESS }}"
          echo "Running smoke tests against ALB..."

          # Test backend health endpoint
          echo "Testing backend health endpoint..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://${ALB_ADDRESS}/health" || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Backend health check passed (HTTP $HTTP_CODE)"
          else
            echo "⚠ Backend health check returned HTTP $HTTP_CODE"
            echo "Note: Pods may still be starting up. Check manually: http://${ALB_ADDRESS}/health"
          fi

          # Test frontend
          echo "Testing frontend endpoint..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://${ALB_ADDRESS}/" || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Frontend check passed (HTTP $HTTP_CODE)"
          else
            echo "⚠ Frontend returned HTTP $HTTP_CODE"
            echo "Note: Streamlit may still be starting up. Check manually: http://${ALB_ADDRESS}/"
          fi

      - name: Deploy monitoring stack
        run: |
          echo "Deploying comprehensive monitoring stack..."
          echo "Components: Prometheus, Grafana, Loki, Tempo, Promtail, kube-state-metrics, node-exporter"

          # Deploy monitoring stack
          kubectl apply -f deployment/k8s/prod/monitoring-stack.yaml
          echo "✓ Monitoring stack manifests applied"

          # Deploy Grafana dashboards
          kubectl apply -f deployment/k8s/prod/grafana-dashboards-configmap.yaml
          echo "✓ Grafana dashboards ConfigMap applied"

          echo ""
          echo "Waiting for monitoring components to be ready..."

          # Wait for main monitoring pods
          kubectl wait --for=condition=ready pod -l app=prometheus -n monitoring --timeout=180s
          kubectl wait --for=condition=ready pod -l app=grafana -n monitoring --timeout=180s
          kubectl wait --for=condition=ready pod -l app=loki -n monitoring --timeout=180s
          kubectl wait --for=condition=ready pod -l app=tempo -n monitoring --timeout=180s
          kubectl wait --for=condition=ready pod -l app=kube-state-metrics -n monitoring --timeout=180s

          # Wait for DaemonSets
          echo "Waiting for DaemonSets..."
          kubectl rollout status daemonset/promtail -n monitoring --timeout=180s
          kubectl rollout status daemonset/node-exporter -n monitoring --timeout=180s

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Comprehensive Monitoring Stack Deployed Successfully"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🔍 Access Monitoring Services (use kubectl port-forward):"
          echo ""
          echo "   📉 Grafana Dashboard (Main Interface):"
          echo "   $ kubectl port-forward -n monitoring svc/grafana 3000:3000"
          echo "   → http://localhost:3000 (admin/admin)"
          echo "   → Pre-loaded dashboards: FastAPI Observability, K8s Cluster Metrics"
          echo ""
          echo "   📈 Prometheus (Metrics):"
          echo "   $ kubectl port-forward -n monitoring svc/prometheus 9090:9090"
          echo "   → http://localhost:9090"
          echo ""
          echo "   📋 Loki (Logs):"
          echo "   $ kubectl port-forward -n monitoring svc/loki 3100:3100"
          echo "   → http://localhost:3100"
          echo ""
          echo "   🔍 Tempo (Distributed Tracing):"
          echo "   $ kubectl port-forward -n monitoring svc/tempo 3200:3200"
          echo "   → http://localhost:3200"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📈 Backend Metrics & Tracing:"
          echo "   Backend metrics available at: /metrics endpoint"
          echo "   OpenTelemetry traces sent to Tempo at: tempo.monitoring.svc.cluster.local:4317"
          echo ""
          echo "🔧 Quick Health Checks:"
          echo "   # All monitoring pods"
          echo "   $ kubectl get pods -n monitoring"
          echo ""
          echo "   # Check DaemonSets (should be running on all nodes)"
          echo "   $ kubectl get daemonsets -n monitoring"
          echo ""
          echo "   # View Prometheus targets"
          echo "   $ kubectl port-forward -n monitoring svc/prometheus 9090:9090"
          echo "   # Then visit: http://localhost:9090/targets"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✅ Monitoring Components:"
          echo "   ✓ Prometheus - Metrics collection with k8s service discovery"
          echo "   ✓ Grafana - Dashboards with Prometheus/Loki/Tempo datasources"
          echo "   ✓ Loki - Log aggregation"
          echo "   ✓ Tempo - Distributed tracing (OTLP/Jaeger compatible)"
          echo "   ✓ Promtail - Log collection (DaemonSet on all nodes)"
          echo "   ✓ kube-state-metrics - K8s cluster state metrics"
          echo "   ✓ node-exporter - Node-level system metrics (DaemonSet)"
          echo ""
          echo "📊 Storage:"
          echo "   • Prometheus: 20Gi gp2"
          echo "   • Loki: 20Gi gp2"
          echo "   • Grafana: 10Gi gp2"
          echo "   • Tempo: 10Gi gp2"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Display application URLs
        run: |
          ALB_ADDRESS="${{ env.ALB_ADDRESS }}"
          IMAGE_TAG="${{ env.IMAGE_TAG }}"
          DESIRED_TAG="${{ env.DESIRED_TAG }}"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 Deployment Successful!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          # Show deployed image version
          if [ "$IMAGE_TAG" = "$DESIRED_TAG" ]; then
            echo "📦 Deployed Image Tag: ${IMAGE_TAG} (from commit ${DESIRED_TAG})"
          else
            echo "📦 Deployed Image Tag: ${IMAGE_TAG}"
            echo "   ⚠ Note: Desired tag ${DESIRED_TAG} not found in ECR, used ${IMAGE_TAG} instead"
          fi
          echo ""

          echo "📱 Application URLs:"
          echo "   Frontend (Streamlit):  http://${ALB_ADDRESS}/"
          echo "   Backend API:           http://${ALB_ADDRESS}/api"
          echo "   API Docs (Swagger):    http://${ALB_ADDRESS}/docs"
          echo "   Health Check:          http://${ALB_ADDRESS}/health"
          echo "   Metrics:               http://${ALB_ADDRESS}/metrics"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📊 Monitoring URLs (use kubectl port-forward):"
          echo ""
          echo "   🔍 Grafana (Dashboards):"
          echo "      kubectl port-forward -n monitoring svc/grafana 3000:3000"
          echo "      → http://localhost:3000"
          echo "      → Default credentials: admin/admin"
          echo ""
          echo "   📈 Prometheus (Metrics):"
          echo "      kubectl port-forward -n monitoring svc/prometheus 9090:9090"
          echo "      → http://localhost:9090"
          echo ""
          echo "   📋 Loki (Logs):"
          echo "      kubectl port-forward -n monitoring svc/loki 3100:3100"
          echo "      → http://localhost:3100"
          echo ""
          echo "   🔗 Tempo (Distributed Tracing):"
          echo "      kubectl port-forward -n monitoring svc/tempo 3200:3200"
          echo "      → http://localhost:3200"
          echo ""
