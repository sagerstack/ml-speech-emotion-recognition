apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ml-speech-emotion
  labels:
    app: ml-speech-emotion-recognition
    service: backend
    environment: local
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-speech-emotion-recognition
      service: backend
  template:
    metadata:
      labels:
        app: ml-speech-emotion-recognition
        service: backend
        environment: local
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: backend
        image: sagerstack/ml-speech-emotion-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DEBUG
          value: "false"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        - name: ENVIRONMENT
          value: "kubernetes"
        - name: AWS_REGION
          value: "us-east-1"
        - name: SAGEMAKER_ENDPOINT_NAME
          value: "test-emotion-endpoint"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: secret-key
        - name: MAX_UPLOAD_SIZE_MB
          value: "30"
        - name: MAX_AUDIO_DURATION_SECONDS
          value: "30"
        - name: PROMETHEUS_ENABLED
          value: "true"
        # OpenTelemetry Configuration for distributed tracing
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "tempo.monitoring.svc.cluster.local:4317"
        - name: OTLP_GRPC_ENDPOINT
          value: "tempo.monitoring.svc.cluster.local:4317"
        - name: OTEL_SERVICE_NAME
          value: "ml-emotion-api"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=ml-emotion-api,service.version=1.0.0,deployment.environment=kubernetes"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ml-speech-emotion
  labels:
    app: ml-speech-emotion-recognition
    service: backend
    environment: local
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  selector:
    app: ml-speech-emotion-recognition
    service: backend
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: ml-speech-emotion
  labels:
    app: ml-speech-emotion-recognition
    service: backend
    environment: local
type: Opaque
stringData:
  secret-key: "test-dev-secret-key-for-local-testing-only"
