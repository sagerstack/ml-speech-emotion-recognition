apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ml-emotion
  labels:
    app: ml-speech-emotion-recognition
    environment: local
data:
  DEBUG: "true"
  LOG_LEVEL: "INFO"
  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: "ml-emotion-local-bucket"
  SAGEMAKER_ENDPOINT_NAME: "test-emotion-endpoint"
  MAX_UPLOAD_SIZE_MB: "30"
  MAX_AUDIO_DURATION_SECONDS: "30"
  PROMETHEUS_ENABLED: "true"
  METRICS_PORT: "9090"
  CORS_ORIGINS: "http://localhost:3000,http://localhost:8501,http://127.0.0.1:3000,http://127.0.0.1:8501"
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_ALLOW_METHODS: "GET, POST, PUT, DELETE, OPTIONS"
  CORS_ALLOW_HEADERS: "*"
  RATE_LIMIT_ENABLED: "false"
  SESSION_TIMEOUT_MINUTES: "30"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "1440"
  STREAMLIT_SERVER_PORT: "8501"
  STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
  BACKEND_API_URL: "http://backend:8000"
  REACT_APP_API_URL: "http://localhost:8000"
  REACT_APP_WS_URL: "ws://localhost:8000"