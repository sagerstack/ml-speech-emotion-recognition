apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    environment: local

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-sa
  namespace: monitoring

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - nodes/proxy
  - nodes/metrics
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - daemonsets
  - replicasets
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
- nonResourceURLs:
  - /metrics
  - /metrics/cadvisor
  verbs:
  - get

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus-sa
  namespace: monitoring

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: "global:\n  scrape_interval: 15s\n  evaluation_interval: 15s\n \
    \ external_labels:\n    cluster: 'local-minikube'\n    environment: 'development'\n\
    \nscrape_configs:\n  # Prometheus self-monitoring\n  - job_name: 'prometheus'\n\
    \    static_configs:\n      - targets: ['localhost:9090']\n        labels:\n \
    \         app: 'prometheus'\n\n  # Kubernetes API Server\n  - job_name: 'kubernetes-apiservers'\n\
    \    kubernetes_sd_configs:\n      - role: endpoints\n    scheme: https\n    tls_config:\n\
    \      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n    bearer_token_file:\
    \ /var/run/secrets/kubernetes.io/serviceaccount/token\n    relabel_configs:\n\
    \      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name,\
    \ __meta_kubernetes_endpoint_port_name]\n        action: keep\n        regex:\
    \ default;kubernetes;https\n\n  # Kubernetes Nodes\n  - job_name: 'kubernetes-nodes'\n\
    \    kubernetes_sd_configs:\n      - role: node\n    scheme: https\n    tls_config:\n\
    \      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n      insecure_skip_verify:\
    \ true\n    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n\
    \    relabel_configs:\n      - action: labelmap\n        regex: __meta_kubernetes_node_label_(.+)\n\
    \n  # Kubernetes Nodes Cadvisor\n  - job_name: 'kubernetes-cadvisor'\n    kubernetes_sd_configs:\n\
    \      - role: node\n    scheme: https\n    tls_config:\n      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n\
    \      insecure_skip_verify: true\n    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n\
    \    relabel_configs:\n      - action: labelmap\n        regex: __meta_kubernetes_node_label_(.+)\n\
    \      - target_label: __address__\n        replacement: kubernetes.default.svc:443\n\
    \      - source_labels: [__meta_kubernetes_node_name]\n        regex: (.+)\n \
    \       target_label: __metrics_path__\n        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor\n\
    \n  # Kubernetes Service Endpoints\n  - job_name: 'kubernetes-service-endpoints'\n\
    \    kubernetes_sd_configs:\n      - role: endpoints\n    relabel_configs:\n \
    \     - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]\n\
    \        action: keep\n        regex: true\n      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]\n\
    \        action: replace\n        target_label: __metrics_path__\n        regex:\
    \ (.+)\n      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]\n\
    \        action: replace\n        target_label: __address__\n        regex: ([^:]+)(?::\\\
    d+)?;(\\d+)\n        replacement: $1:$2\n      - action: labelmap\n        regex:\
    \ __meta_kubernetes_service_label_(.+)\n      - source_labels: [__meta_kubernetes_namespace]\n\
    \        action: replace\n        target_label: kubernetes_namespace\n      -\
    \ source_labels: [__meta_kubernetes_service_name]\n        action: replace\n \
    \       target_label: kubernetes_service_name\n\n  # Kubernetes Pods\n  - job_name:\
    \ 'kubernetes-pods'\n    kubernetes_sd_configs:\n      - role: pod\n    relabel_configs:\n\
    \      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]\n\
    \        action: keep\n        regex: true\n      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]\n\
    \        action: replace\n        target_label: __metrics_path__\n        regex:\
    \ (.+)\n      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]\n\
    \        action: replace\n        regex: ([^:]+)(?::\\d+)?;(\\d+)\n        replacement:\
    \ $1:$2\n        target_label: __address__\n      - action: labelmap\n       \
    \ regex: __meta_kubernetes_pod_label_(.+)\n      - source_labels: [__meta_kubernetes_namespace]\n\
    \        action: replace\n        target_label: kubernetes_namespace\n      -\
    \ source_labels: [__meta_kubernetes_pod_name]\n        action: replace\n     \
    \   target_label: kubernetes_pod_name\n\n  # FastAPI Backend (explicit config\
    \ for ml-speech-emotion app)\n  - job_name: 'backend-ml-app'\n    kubernetes_sd_configs:\n\
    \      - role: pod\n        namespaces:\n          names:\n            - ml-speech-emotion\n\
    \    relabel_configs:\n      - source_labels: [__meta_kubernetes_pod_label_service]\n\
    \        action: keep\n        regex: backend\n      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]\n\
    \        action: keep\n        regex: true\n      - source_labels: [__address__,\
    \ __meta_kubernetes_pod_annotation_prometheus_io_port]\n        action: replace\n\
    \        target_label: __address__\n        regex: ([^:]+)(?::\\d+)?;(\\d+)\n\
    \        replacement: $1:$2\n      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]\n\
    \        action: replace\n        target_label: __metrics_path__\n        regex:\
    \ (.+)\n      - source_labels: [__meta_kubernetes_namespace]\n        target_label:\
    \ namespace\n      - source_labels: [__meta_kubernetes_pod_name]\n        target_label:\
    \ pod\n      - source_labels: [__meta_kubernetes_pod_label_app]\n        target_label:\
    \ app\n"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus-sa
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
          name: http
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus/
        - --storage.tsdb.retention.time=7d
        - --web.enable-lifecycle
        - --web.enable-admin-api
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 500m
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/
        - name: prometheus-storage
          mountPath: /prometheus/
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-storage
        emptyDir: {}

---

apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '9090'
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9090
    targetPort: 9090
  selector:
    app: prometheus

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki.yml: "auth_enabled: false\n\nserver:\n  http_listen_port: 3100\n  grpc_listen_port:\
    \ 9096\n\ningester:\n  lifecycler:\n    address: 127.0.0.1\n    ring:\n      kvstore:\n\
    \        store: inmemory\n      replication_factor: 1\n    final_sleep: 0s\n \
    \ chunk_idle_period: 1h\n  max_chunk_age: 1h\n  chunk_target_size: 1048576\n \
    \ chunk_retain_period: 30s\n  max_transfer_retries: 0\n  wal:\n    enabled: true\n\
    \    dir: /loki/wal\n\nschema_config:\n  configs:\n    - from: 2020-10-24\n  \
    \    store: boltdb-shipper\n      object_store: filesystem\n      schema: v11\n\
    \      index:\n        prefix: index_\n        period: 24h\n\nstorage_config:\n\
    \  boltdb_shipper:\n    active_index_directory: /loki/boltdb-shipper-active\n\
    \    cache_location: /loki/boltdb-shipper-cache\n    cache_ttl: 24h\n  filesystem:\n\
    \    directory: /loki/chunks\n\ncompactor:\n  working_directory: /loki/compactor\n\
    \  compaction_interval: 10m\n\nlimits_config:\n  reject_old_samples: true\n  reject_old_samples_max_age:\
    \ 168h\n  ingestion_rate_mb: 4\n  ingestion_burst_size_mb: 6\n  per_stream_rate_limit:\
    \ 3MB\n  per_stream_rate_limit_burst: 15MB\n\nchunk_store_config:\n  max_look_back_period:\
    \ 0s\n\ntable_manager:\n  retention_deletes_enabled: false\n  retention_period:\
    \ 0s\n\nruler:\n  storage:\n    type: local\n    local:\n      directory: /loki/rules\n\
    \  rule_path: /loki/rules-temp\n  alertmanager_url: http://localhost:9093\n  ring:\n\
    \    kvstore:\n      store: inmemory\n  enable_api: true\n"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:2.9.3
        ports:
        - containerPort: 3100
          name: http
        - containerPort: 9096
          name: grpc
        args:
        - -config.file=/etc/loki/loki.yml
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 200m
        volumeMounts:
        - name: loki-config
          mountPath: /etc/loki
        - name: loki-storage
          mountPath: /loki
        livenessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 45
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 45
          periodSeconds: 10
      volumes:
      - name: loki-config
        configMap:
          name: loki-config
      - name: loki-storage
        emptyDir: {}

---

apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3100
    targetPort: 3100
  - name: grpc
    port: 9096
    targetPort: 9096
  selector:
    app: loki

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail-sa
  namespace: monitoring

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
- kind: ServiceAccount
  name: promtail-sa
  namespace: monitoring

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yml: "server:\n  http_listen_port: 3101\n  grpc_listen_port: 0\n\npositions:\n\
    \  filename: /tmp/positions.yaml\n\nclients:\n  - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push\n\
    \    tenant_id: local\n    batchwait: 1s\n    batchsize: 1048576\n    timeout:\
    \ 10s\n\nscrape_configs:\n  # Scrape all pod logs\n  - job_name: kubernetes-pods\n\
    \    kubernetes_sd_configs:\n      - role: pod\n    pipeline_stages:\n      -\
    \ cri: {}\n      - regex:\n          expression: '^(?P<timestamp>\\S+) (?P<stream>\\\
    S+) (?P<flags>\\S+) (?P<message>.+)$'\n      - labels:\n          stream:\n  \
    \    - timestamp:\n          source: timestamp\n          format: RFC3339Nano\n\
    \    relabel_configs:\n      - source_labels: [__meta_kubernetes_pod_controller_name]\n\
    \        regex: ([0-9a-z-.]+?)(-[0-9a-f]{8,10})?\n        action: replace\n  \
    \      target_label: __tmp_controller_name\n      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name,\
    \ __meta_kubernetes_pod_label_app, __tmp_controller_name, __meta_kubernetes_pod_name]\n\
    \        regex: ^;*([^;]+)(;.*)?$\n        action: replace\n        target_label:\
    \ app\n      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component,\
    \ __meta_kubernetes_pod_label_component]\n        regex: ^;*([^;]+)(;.*)?$\n \
    \       action: replace\n        target_label: component\n      - source_labels:\
    \ [__meta_kubernetes_pod_node_name]\n        action: replace\n        target_label:\
    \ node_name\n      - source_labels: [__meta_kubernetes_namespace]\n        action:\
    \ replace\n        target_label: namespace\n      - source_labels: [__meta_kubernetes_pod_name]\n\
    \        action: replace\n        target_label: pod\n      - source_labels: [__meta_kubernetes_pod_container_name]\n\
    \        action: replace\n        target_label: container\n      - replacement:\
    \ /var/log/pods/*$1/*.log\n        separator: /\n        source_labels:\n    \
    \    - __meta_kubernetes_pod_uid\n        - __meta_kubernetes_pod_container_name\n\
    \        target_label: __path__\n\n  # Scrape ML Backend logs specifically\n \
    \ - job_name: ml-backend\n    kubernetes_sd_configs:\n      - role: pod\n    \
    \    namespaces:\n          names:\n            - ml-speech-emotion\n    pipeline_stages:\n\
    \      - cri: {}\n      - json:\n          expressions:\n            level: level\n\
    \            timestamp: timestamp\n            message: message\n            logger:\
    \ logger\n      - labels:\n          level:\n          logger:\n      - timestamp:\n\
    \          source: timestamp\n          format: RFC3339\n    relabel_configs:\n\
    \      - source_labels: [__meta_kubernetes_pod_label_service]\n        action:\
    \ keep\n        regex: backend\n      - source_labels: [__meta_kubernetes_namespace]\n\
    \        action: replace\n        target_label: namespace\n      - source_labels:\
    \ [__meta_kubernetes_pod_name]\n        action: replace\n        target_label:\
    \ pod\n      - source_labels: [__meta_kubernetes_pod_container_name]\n       \
    \ action: replace\n        target_label: container\n      - source_labels: [__meta_kubernetes_pod_label_app]\n\
    \        action: replace\n        target_label: app\n      - replacement: /var/log/pods/*$1/*.log\n\
    \        separator: /\n        source_labels:\n        - __meta_kubernetes_pod_uid\n\
    \        - __meta_kubernetes_pod_container_name\n        target_label: __path__\n\
    \n  # Scrape Streamlit logs specifically\n  - job_name: ml-streamlit\n    kubernetes_sd_configs:\n\
    \      - role: pod\n        namespaces:\n          names:\n            - ml-speech-emotion\n\
    \    pipeline_stages:\n      - cri: {}\n      - regex:\n          expression:\
    \ '^(?P<timestamp>\\S+) (?P<stream>\\S+) (?P<flags>\\S+) (?P<message>.+)$'\n \
    \     - labels:\n          stream:\n      - timestamp:\n          source: timestamp\n\
    \          format: RFC3339Nano\n    relabel_configs:\n      - source_labels: [__meta_kubernetes_pod_label_service]\n\
    \        action: keep\n        regex: streamlit\n      - source_labels: [__meta_kubernetes_namespace]\n\
    \        action: replace\n        target_label: namespace\n      - source_labels:\
    \ [__meta_kubernetes_pod_name]\n        action: replace\n        target_label:\
    \ pod\n      - source_labels: [__meta_kubernetes_pod_container_name]\n       \
    \ action: replace\n        target_label: container\n      - source_labels: [__meta_kubernetes_pod_label_app]\n\
    \        action: replace\n        target_label: app\n      - replacement: /var/log/pods/*$1/*.log\n\
    \        separator: /\n        source_labels:\n        - __meta_kubernetes_pod_uid\n\
    \        - __meta_kubernetes_pod_container_name\n        target_label: __path__\n"

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3101'
    spec:
      serviceAccountName: promtail-sa
      containers:
      - name: promtail
        image: grafana/promtail:latest
        args:
        - -config.file=/etc/promtail/promtail.yml
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - containerPort: 3101
          name: http-metrics
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 100m
        volumeMounts:
        - name: config
          mountPath: /etc/promtail
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        securityContext:
          privileged: true
          runAsUser: 0
      volumes:
      - name: config
        configMap:
          name: promtail-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers

---

apiVersion: v1
kind: Service
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http-metrics
    port: 3101
    targetPort: 3101
  selector:
    app: promtail

---

apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: monitoring
type: Opaque
stringData:
  admin-password: admin

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        uid: DS_PROMETHEUS
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 15s
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: DS_TEMPO
        version: 1

      - name: Loki
        type: loki
        access: proxy
        uid: DS_LOKI
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: false
        editable: false
        jsonData:
          maxLines: 5000
          timeout: 60
          derivedFields:
            - datasourceUid: DS_TEMPO
              matcherRegex: "trace_id=(\\w+)"
              name: TraceID
              url: "${__value.raw}"
        version: 1

      - name: Tempo
        type: tempo
        access: proxy
        uid: DS_TEMPO
        url: http://tempo.monitoring.svc.cluster.local:3200
        isDefault: false
        editable: false
        jsonData:
          httpMethod: GET
          tracesToLogs:
            datasourceUid: DS_LOKI
            tags: ['app', 'namespace', 'pod']
            mappedTags: [{ key: 'service.name', value: 'app' }]
            mapTagNamesEnabled: true
            filterByTraceID: true
            filterBySpanID: false
          tracesToMetrics:
            datasourceUid: DS_PROMETHEUS
            tags: [{ key: 'service.name', value: 'service' }]
            queries:
              - name: Request Rate
                query: 'sum(rate(fastapi_requests_total{app_name="$${__tags.service}"}[5m]))'
              - name: Error Rate
                query: 'sum(rate(fastapi_responses_total{app_name="$${__tags.service}", status_code=~"5.."}[5m]))'
          serviceMap:
            datasourceUid: DS_PROMETHEUS
          nodeGraph:
            enabled: true
          lokiSearch:
            datasourceUid: DS_LOKI
        version: 1

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards.yaml: "apiVersion: 1\nproviders:\n  - name: 'ML Emotion Recognition Dashboards'\n\
    \    orgId: 1\n    folder: 'ML App Monitoring'\n    type: file\n    disableDeletion:\
    \ false\n    updateIntervalSeconds: 10\n    allowUiUpdates: true\n    options:\n\
    \      path: /var/lib/grafana/dashboards\n"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsNonRoot: true
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-secret
              key: admin-password
        - name: GF_SERVER_ROOT_URL
          value: '%(protocol)s://%(domain)s:%(http_port)s/'
        - name: GF_INSTALL_PLUGINS
          value: ''
        - name: GF_PATHS_PROVISIONING
          value: /etc/grafana/provisioning
        - name: GF_USERS_DEFAULT_THEME
          value: dark
        - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
          value: /var/lib/grafana/dashboards/k8s-dashboard.json
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 200m
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 5
      volumes:
      - name: grafana-storage
        emptyDir: {}
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboard-provider
        configMap:
          name: grafana-dashboard-provider
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards

