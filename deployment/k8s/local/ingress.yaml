apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-emotion-ingress
  namespace: ml-speech-emotion
  labels:
    app: ml-speech-emotion-recognition
    environment: local
  annotations:
    # NOTE: rewrite-target removed - services now understand /ml-ser base path
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
spec:
  ingressClassName: nginx
  rules:
  - host: localhost
    http:
      paths:
      # Backend API v1 endpoints
      - path: /ml-ser/v1
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      # Backend API v2 endpoints (for inference)
      - path: /ml-ser/v2
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      # Legacy /api prefix support
      - path: /ml-ser/api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      # Backend health check
      - path: /ml-ser/health
        pathType: Exact
        backend:
          service:
            name: backend
            port:
              number: 8000
      # API documentation (Swagger UI)
      - path: /ml-ser/docs
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      # OpenAPI schema (required by Swagger UI)
      - path: /ml-ser/openapi.json
        pathType: Exact
        backend:
          service:
            name: backend
            port:
              number: 8000
      # ReDoc documentation
      - path: /ml-ser/redoc
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      # Prometheus metrics
      - path: /ml-ser/metrics
        pathType: Exact
        backend:
          service:
            name: backend
            port:
              number: 9090
      # Grafana monitoring - consolidated from monitoring-ingress.yaml
      - path: /ml-ser/grafana
        pathType: Prefix
        backend:
          service:
            name: grafana
            namespace: monitoring
            port:
              number: 3000
      # Streamlit frontend - must be last (catch-all for /ml-ser/*)
      - path: /ml-ser
        pathType: Prefix
        backend:
          service:
            name: streamlit
            port:
              number: 8501
