apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  namespace: ml-emotion
  labels:
    app: ml-speech-emotion-recognition
    service: streamlit
    environment: local
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-speech-emotion-recognition
      service: streamlit
  template:
    metadata:
      labels:
        app: ml-speech-emotion-recognition
        service: streamlit
        environment: local
    spec:
      containers:
      - name: streamlit
        image: sagerstack/ml-speech-emotion-recognition-streamlit:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8501
          name: http
        env:
        - name: STREAMLIT_SERVER_PORT
          value: "8501"
        - name: STREAMLIT_SERVER_ADDRESS
          value: "0.0.0.0"
        - name: BACKEND_API_URL
          value: "http://backend:8000"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: streamlit
  namespace: ml-emotion
  labels:
    app: ml-speech-emotion-recognition
    service: streamlit
    environment: local
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8501
    targetPort: 8501
    protocol: TCP
  selector:
    app: ml-speech-emotion-recognition
    service: streamlit