apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  namespace: ml-speech-emotion
  labels:
    app: ml-speech-emotion-recognition
    service: streamlit
    environment: local
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-speech-emotion-recognition
      service: streamlit
  template:
    metadata:
      labels:
        app: ml-speech-emotion-recognition
        service: streamlit
        environment: local
    spec:
      containers:
      - name: streamlit
        image: sagerstack/ml-speech-emotion-streamlit:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8501
          name: http
        env:
        - name: STREAMLIT_SERVER_PORT
          value: "8501"
        - name: STREAMLIT_SERVER_ADDRESS
          value: "0.0.0.0"
        - name: STREAMLIT_SERVER_BASE_URL_PATH
          value: "/ml-ser"
        - name: ML_APP_BASE_URL
          value: "http://backend:8000"
        - name: GRAFANA_URL
          value: "/ml-ser/grafana"
        - name: REQUEST_TIMEOUT
          value: "120"
        - name: ENABLE_MOCK_MODE
          value: "false"
        - name: FALLBACK_TO_MOCK
          value: "true"
        - name: STREAMLIT_SERVER_FILE_WATCHER_TYPE
          value: "none"
        - name: STREAMLIT_RUNNER_MAGIC_ENABLED
          value: "false"
        - name: NUMBA_DISABLE_JIT
          value: "1"
        # Disable librosa's joblib cache to avoid filesystem write issues
        - name: LIBROSA_CACHE_DIR
          value: ""
        - name: LIBROSA_CACHE_LEVEL
          value: "0"
        # Set joblib temp folder to writable location for memory-mapped operations
        - name: JOBLIB_TEMP_FOLDER
          value: "/tmp"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /ml-ser/_stcore/health
            port: 8501
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /ml-ser/_stcore/health
            port: 8501
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: streamlit
  namespace: ml-speech-emotion
  labels:
    app: ml-speech-emotion-recognition
    service: streamlit
    environment: local
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8501
    targetPort: 8501
    protocol: TCP
  selector:
    app: ml-speech-emotion-recognition
    service: streamlit
