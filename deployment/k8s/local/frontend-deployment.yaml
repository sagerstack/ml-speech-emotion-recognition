apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ml-emotion
  labels:
    app: ml-speech-emotion-recognition
    service: frontend
    environment: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-speech-emotion-recognition
      service: frontend
  template:
    metadata:
      labels:
        app: ml-speech-emotion-recognition
        service: frontend
        environment: local
    spec:
      containers:
      - name: frontend
        image: sagerstack/ml-emotion-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        env:
        - name: REACT_APP_API_URL
          value: "http://localhost:8000"
        - name: REACT_APP_WS_URL
          value: "ws://localhost:8000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ml-emotion
  labels:
    app: ml-speech-emotion-recognition
    service: frontend
    environment: local
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: ml-speech-emotion-recognition
    service: frontend