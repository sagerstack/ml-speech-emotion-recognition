# Node Exporter DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
    environment: local
spec:
  selector:
      matchLabels:
        app: node-exporter
        environment: local
  template:
      metadata:
        labels:
          app: node-exporter
          environment: local
      spec:
        serviceAccountName: prometheus
        hostPID: true
        hostNetwork: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
        containers:
        - name: node-exporter
          image: prom/node-exporter:v1.3.1
          imagePullPolicy: Always
          args:
            - "--path.rootfs=/host"
            - "--path.procfs=/host/proc"
            - "--path.sysfs=/host/sys"
            - "--path.rootfs=/host"
            - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var|host|etc)($|/)"
            - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|cgroup|config|debugfs|devpts|efivarfs|fuse|fusectl|hugetlbfs|nfs|overlayfs|proc|proc|run|secrets|sys|tmp|var|devpts|devtmp|squashfs|tracefs|fuse.tctl|devpts|devtmp|fusectl|auto.devpts|pts|udev|shm|swap|sysfs)($|/)"
          ports:
          - containerPort: 9100
            name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
          - name: root
            mountPath: /host
            readOnly: true
          - name: proc
            mountPath: /host/proc
            readOnly: true
          - name: sys
            mountPath: /host/sys
            readOnly: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            add:
            - SYS_TIME
            - CAP_DAC_READ_SEARCH
          drop:
            - ALL
          readOnlyRootFilesystem: false
        volumes:
        - name: root
          hostPath: /
          readOnly: true
        - name: proc
          hostPath: /proc
          readOnly: true
        - name: sys
          hostPath: /sys
          readOnly: true
      tolerations:
      - effect: NoSchedule
        operator: Exists
