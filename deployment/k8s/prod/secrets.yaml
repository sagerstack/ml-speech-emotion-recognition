apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: ml-speech-emotion
  labels:
    app: ml-speech-emotion-recognition
    service: backend
    environment: production
type: Opaque
stringData:
  secret-key: "REPLACE_WITH_PRODUCTION_SECRET_KEY"
  sagemaker-endpoint-name: "ml-ser-v1"
  s3-bucket-name: "ml-emotion-prod-bucket"
  redis-url: "redis://prod-redis:6379"
  jwt-secret: "REPLACE_WITH_JWT_SECRET"
  api-key: "REPLACE_WITH_API_KEY"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-service-account
  namespace: ml-speech-emotion
  labels:
    app: ml-speech-emotion-recognition
    service: backend
    environment: production
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::303440520181:role/ml-speech-backend-irsa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamlit-service-account
  namespace: ml-speech-emotion
  labels:
    app: ml-speech-emotion-recognition
    service: streamlit
    environment: production
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/ml-speech-streamlit-irsa
