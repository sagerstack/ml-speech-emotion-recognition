apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: ml-emotion-prod
  labels:
    app: ml-speech-emotion-recognition
    service: backend
    environment: production
type: Opaque
stringData:
  secret-key: "REPLACE_WITH_PRODUCTION_SECRET_KEY"
  sagemaker-endpoint-name: "prod-emotion-recognition-endpoint"
  s3-bucket-name: "ml-emotion-prod-bucket"
  redis-url: "redis://prod-redis:6379"
  aws-access-key-id: "REPLACE_WITH_AWS_ACCESS_KEY_ID"
  aws-secret-access-key: "REPLACE_WITH_AWS_SECRET_ACCESS_KEY"
  database-url: "REPLACE_WITH_DATABASE_URL"
  jwt-secret: "REPLACE_WITH_JWT_SECRET"
  api-key: "REPLACE_WITH_API_KEY"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-service-account
  namespace: ml-emotion-prod
  labels:
    app: ml-speech-emotion-recognition
    service: backend
    environment: production
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ml-emotion-backend-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamlit-service-account
  namespace: ml-emotion-prod
  labels:
    app: ml-speech-emotion-recognition
    service: streamlit
    environment: production
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ml-emotion-streamlit-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-service-account
  namespace: ml-emotion-prod
  labels:
    app: ml-speech-emotion-recognition
    service: frontend
    environment: production
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ml-emotion-frontend-role