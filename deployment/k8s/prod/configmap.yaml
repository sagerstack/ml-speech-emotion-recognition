apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ml-emotion-prod
  labels:
    app: ml-speech-emotion-recognition
    environment: production
data:
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  AWS_REGION: "us-east-1"
  MAX_UPLOAD_SIZE_MB: "30"
  MAX_AUDIO_DURATION_SECONDS: "30"
  PROMETHEUS_ENABLED: "true"
  METRICS_PORT: "9090"
  CORS_ORIGINS: "https://ml-emotion.example.com,https://app.ml-emotion.example.com,https://dashboard.ml-emotion.example.com"
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_ALLOW_METHODS: "GET, POST, PUT, DELETE, OPTIONS"
  CORS_ALLOW_HEADERS: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Amz-Date,X-Amz-Security-Token,X-Api-Key"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
  SESSION_TIMEOUT_MINUTES: "30"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "1440"
  STREAMLIT_SERVER_PORT: "8501"
  STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
  BACKEND_API_URL: "https://api.ml-emotion.example.com"
  REACT_APP_API_URL: "https://api.ml-emotion.example.com"
  REACT_APP_WS_URL: "wss://api.ml-emotion.example.com"
  REACT_APP_ENVIRONMENT: "production"
  REACT_APP_VERSION: "1.0.0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: ml-emotion-prod
  labels:
    app: ml-speech-emotion-recognition
    environment: production
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied expired no-cache no-store private must-revalidate auth;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript;

        # API proxy
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # React Router support
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Static assets with cache
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Error pages
        error_page 404 /index.html;
    }