apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ml-speech-emotion
  labels:
    app: ml-speech-emotion-recognition
    environment: production
data:
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  AWS_REGION: "us-east-1"
  MAX_UPLOAD_SIZE_MB: "30"
  MAX_AUDIO_DURATION_SECONDS: "30"
  PROMETHEUS_ENABLED: "true"
  METRICS_PORT: "9090"
  CORS_ORIGINS: "https://ml-emotion.example.com,https://app.ml-emotion.example.com,https://dashboard.ml-emotion.example.com"
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_ALLOW_METHODS: "GET, POST, PUT, DELETE, OPTIONS"
  CORS_ALLOW_HEADERS: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Amz-Date,X-Amz-Security-Token,X-Api-Key"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
  SESSION_TIMEOUT_MINUTES: "30"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "1440"
  STREAMLIT_SERVER_PORT: "8501"
  STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
  BACKEND_API_URL: "http://backend:8000"
