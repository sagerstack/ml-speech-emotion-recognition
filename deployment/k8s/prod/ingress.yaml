apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-emotion-ingress
  namespace: ml-speech-emotion
  labels:
    app: ml-speech-emotion-recognition
    environment: production
  annotations:
    kubernetes.io/ingress.class: "alb"
    # Share ALB with monitoring ingress
    alb.ingress.kubernetes.io/group.name: "ml-emotion-prod"
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '3'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    alb.ingress.kubernetes.io/success-codes: '200,302'
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
    # HTTP only - HTTPS will be handled by CloudFront after setup
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # Session stickiness for WebSocket support (required for Streamlit)
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400
    # Enable CORS
    alb.ingress.kubernetes.io/enable-cors: 'true'
    alb.ingress.kubernetes.io/cors-allow-origin: '["*"]'
    alb.ingress.kubernetes.io/cors-allow-methods: '["GET", "POST", "PUT", "DELETE", "OPTIONS"]'
    alb.ingress.kubernetes.io/cors-allow-headers: '["DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Amz-Date,X-Amz-Security-Token,X-Api-Key"]'
    alb.ingress.kubernetes.io/cors-max-age: '86400'
    alb.ingress.kubernetes.io/rate-limit-requests-per-second: '100'
    alb.ingress.kubernetes.io/rate-limit-burst: '200'
    external-dns.alpha.kubernetes.io/hostname: "api.ml-emotion.example.com,app.ml-emotion.example.com"
spec:
  rules:
  - http:
      paths:
      # Backend API v1 endpoints
      - path: /ml-ser/v1
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      # Backend API v2 endpoints (for inference)
      - path: /ml-ser/v2
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      # Legacy /api prefix support
      - path: /ml-ser/api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      # Backend health check
      - path: /ml-ser/health
        pathType: Exact
        backend:
          service:
            name: backend
            port:
              number: 8000
      # API documentation (Swagger UI)
      - path: /ml-ser/docs
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      # OpenAPI schema (required by Swagger UI)
      - path: /ml-ser/openapi.json
        pathType: Exact
        backend:
          service:
            name: backend
            port:
              number: 8000
      # ReDoc documentation
      - path: /ml-ser/redoc
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      # Prometheus metrics
      - path: /ml-ser/metrics
        pathType: Exact
        backend:
          service:
            name: backend
            port:
              number: 9090
      # Grafana monitoring - uses ExternalName service (see grafana-external-service.yaml)
      - path: /ml-ser/grafana
        pathType: Prefix
        backend:
          service:
            name: grafana-external
            port:
              number: 3000
      # Streamlit frontend - must be last (catch-all for /ml-ser/*)
      - path: /ml-ser
        pathType: Prefix
        backend:
          service:
            name: streamlit
            port:
              number: 8501
