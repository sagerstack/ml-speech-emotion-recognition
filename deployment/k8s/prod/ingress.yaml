apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-emotion-ingress
  namespace: ml-emotion-prod
  labels:
    app: ml-speech-emotion-recognition
    environment: production
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '3'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    alb.ingress.kubernetes.io/success-codes: '200,302'
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-2016-08
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/12345678-1234-1234-1234-123456789012
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/redirect-http-to-https: 'true'
    alb.ingress.kubernetes.io/enable-cors: 'true'
    alb.ingress.kubernetes.io/cors-allow-origin: '["https://ml-emotion.example.com", "https://dashboard.ml-emotion.example.com", "https://app.ml-emotion.example.com"]'
    alb.ingress.kubernetes.io/cors-allow-methods: '["GET", "POST", "PUT", "DELETE", "OPTIONS"]'
    alb.ingress.kubernetes.io/cors-allow-headers: '["DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Amz-Date,X-Amz-Security-Token,X-Api-Key"]'
    alb.ingress.kubernetes.io/cors-max-age: '86400'
    alb.ingress.kubernetes.io/rate-limit-requests-per-second: '100'
    alb.ingress.kubernetes.io/rate-limit-burst: '200'
    external-dns.alpha.kubernetes.io/hostname: "ml-emotion.example.com,app.ml-emotion.example.com,dashboard.ml-emotion.example.com"
spec:
  rules:
  - host: ml-emotion.example.com
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /health
        pathType: Exact
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /docs(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: backend
            port:
              number: 9090
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
  - host: api.ml-emotion.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
  - host: app.ml-emotion.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: streamlit
            port:
              number: 8501
  - host: dashboard.ml-emotion.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80