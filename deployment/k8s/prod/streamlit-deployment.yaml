apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  namespace: ml-speech-emotion
  labels:
    app: ml-speech-emotion-recognition
    service: streamlit
    environment: production
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-speech-emotion-recognition
      service: streamlit
  template:
    metadata:
      labels:
        app: ml-speech-emotion-recognition
        service: streamlit
        environment: production
        version: v1
    spec:
      serviceAccountName: streamlit-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: streamlit
        image: sagerstack/ml-speech-emotion-streamlit:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8501
          name: http
          protocol: TCP
        env:
        - name: STREAMLIT_SERVER_PORT
          value: "8501"
        - name: STREAMLIT_SERVER_ADDRESS
          value: "0.0.0.0"
        - name: STREAMLIT_SERVER_BASE_URL_PATH
          value: "/ml-ser"
        - name: ML_APP_BASE_URL
          value: "http://backend:8000"
        - name: GRAFANA_URL
          value: "/ml-ser/grafana"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
        - name: STREAMLIT_SERVER_ENABLE_CORS
          value: "true"
        - name: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
          value: "false"
        - name: STREAMLIT_SERVER_ENABLE_WEBSOCKET_COMPRESSION
          value: "true"
        - name: STREAMLIT_SERVER_FILE_WATCHER_TYPE
          value: "none"
        - name: STREAMLIT_RUNNER_MAGIC_ENABLED
          value: "false"
        - name: NUMBA_CACHE_DIR
          value: "/tmp/numba_cache"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /ml-ser/_stcore/health
            port: 8501
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /ml-ser/_stcore/health
            port: 8501
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /ml-ser/_stcore/health
            port: 8501
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 24
          successThreshold: 1
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: app-config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
      - name: app-config
        configMap:
          name: app-config
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ml-speech-emotion-recognition
                - key: service
                  operator: In
                  values:
                  - streamlit
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: streamlit
  namespace: ml-speech-emotion
  labels:
    app: ml-speech-emotion-recognition
    service: streamlit
    environment: production
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8501
    targetPort: 8501
    protocol: TCP
  selector:
    app: ml-speech-emotion-recognition
    service: streamlit
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streamlit-hpa
  namespace: ml-speech-emotion
  labels:
    app: ml-speech-emotion-recognition
    service: streamlit
    environment: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streamlit
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Max
