[tool:pytest]
minversion = 7.0
addopts =
    --strict-markers
    --strict-config
    --verbose
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=90
    --tb=short
    -ra
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (require external services)
    e2e: End-to-end tests (slow, full workflow)
    slow: Tests that take more than 1 second
    aws: Tests that require AWS services
    audio: Tests that require audio processing
    api: Tests that require API endpoints
    auth: Tests that require authentication
asyncio_mode = auto